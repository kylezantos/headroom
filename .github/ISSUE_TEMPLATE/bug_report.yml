name: Bug report
description: Something in Headroom is wrong or broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      multiple: true
      options: [Claude, Codex, Grok, Cursor, Copilot, API spend, Not provider-specific]
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options: [Menu bar, Popover, Settings, Mac widget, iPhone or iPad app, iPhone widget, Lock Screen widget, Notifications]
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Headroom version (Settings › About), macOS or iOS version, and the provider CLI version if it's a provider problem.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: markdown
    attributes:
      value: Please leave out account emails, API keys and anything copied from a CLI's config or auth files.
