name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            threat-models: local
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: CodeQL (swift)
    # Match CI's Xcode 27 / Swift 6.4 environment, not macos-latest's older Xcode.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Unpack Sparkle
        run: ./Scripts/build-app.sh --deps-only
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          config: |
            threat-models: local
      - name: Build Mac app and widgets
        run: |
          xcodebuild -project Headroom.xcodeproj -scheme Headroom \
            -destination 'platform=macOS' -derivedDataPath ./.xcode-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone app and widgets
        run: |
          xcodebuild -project Headroom.xcodeproj -scheme HeadroomIOS \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ./.ios-derived \
            CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
