<!doctype html>
<!--
  Headroom DMG installer window background — native/minimal.
  Source of truth for Assets/Release/dmg-background.png (@1x 680x440) and
  dmg-background@2x.png (@2x 1360x880). Regenerate with make-dmg-background.sh.

  This bitmap intentionally contains ONLY: ground, icon seats, drag arrow, and
  instruction. No wordmark/logo — the volume icon + name in the Finder title
  bar already carry branding, so the window content stays plain and native.
  The Headroom.app icon, the Applications folder, and their name labels are
  drawn by Finder on top at run time (see Scripts/release-app.sh ->
  create_drag_install_dmg). Do not draw icons here.

  Canvas 680 x 440. Finder icon-view positions (content coords):
    Headroom.app  center 196,176   |   Applications  center 484,176   |   icon size 128
  Vertically centered: icon+label block and instruction line are balanced around
  the 440px content height now that there's no header content up top.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  @font-face { font-family: 'TX-02'; font-weight: 500; src: local('TX-02 Medium'), local('TX-02'); }

  .plate {
    position: relative;
    width: 680px;
    height: 440px;
    overflow: hidden;
    background-color: #0B0B0C;
    background-image: radial-gradient(130% 100% at 50% -10%, #16161A 0%, #0C0C0E 46%, #09090A 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* Soft seats where Finder drops the two icons */
  .seat {
    position: absolute;
    top: 120px;
    width: 220px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,255,255,0.045), rgba(255,255,255,0) 72%);
  }
  .seat-left  { left: 86px; }
  .seat-right { left: 374px; }

  .arrow {
    position: absolute; left: 266px; top: 162px; width: 148px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .arrow span {
    font-family: 'TX-02'; font-weight: 500; font-size: 24px; line-height: 1;
    letter-spacing: 0.1em; color: #E3B24E; padding-left: 0.1em;
  }

  .instruction {
    position: absolute; top: 318px; left: 0; width: 680px;
    display: flex; justify-content: center;
  }
  .instruction span {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-weight: 500; font-size: 12px;
    letter-spacing: 0.06em; color: #8B8B86;
  }
</style>
</head>
<body>
  <div class="plate">
    <div class="seat seat-left"></div>
    <div class="seat seat-right"></div>

    <div class="arrow"><span>&gt;&gt;</span></div>

    <div class="instruction"><span>DRAG TO INSTALL</span></div>
  </div>
</body>
</html>
