name: Headroom
options:
  bundleIdPrefix: com.kylezantos
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8D42S4MS38
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    HEADROOM_APP_GROUP_IDENTIFIER: group.com.kylezantos.headroom
    HEADROOM_SPARKLE_FEED_URL: ""
    HEADROOM_SPARKLE_PUBLIC_ED_KEY: VkSwNYbBn5WJUbqYFyhewIFZt4DIfCwiWmTNiGGDorM=
targets:
  HeadroomCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HeadroomCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.core
        GENERATE_INFOPLIST_FILE: YES
  Headroom:
    type: application
    platform: macOS
    sources:
      - path: Sources/HeadroomApp
        excludes:
          - HeadroomApp.entitlements
      # L9P: the Widgets & iPhone settings pane previews the real small/medium widget
      # bodies. Compiled into the app the same way the two widget extensions compile it.
      - path: Sources/HeadroomWidgetSharedUI
      # KTD1 (iOS parity): one shared stateless component folder on every host.
      - path: Sources/HeadroomSharedUI
    dependencies:
      - target: HeadroomCore
      - target: HeadroomWidgets
        embed: true
      - framework: .xcode-derived/SourcePackages/artifacts/sparkle/Sparkle/Sparkle.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom
        MARKETING_VERSION: 1.8
        CURRENT_PROJECT_VERSION: 48
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/HeadroomApp/HeadroomApp.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Headroom
        INFOPLIST_KEY_CFBundleName: Headroom
        INFOPLIST_KEY_CFBundleShortVersionString: 1.8
        INFOPLIST_KEY_CFBundleVersion: 48
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_HeadroomAppGroupIdentifier: "$(HEADROOM_APP_GROUP_IDENTIFIER)"
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Personal use
        INFOPLIST_KEY_SUAllowsAutomaticUpdates: YES
        INFOPLIST_KEY_SUAutomaticallyUpdate: NO
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUFeedURL: "$(HEADROOM_SPARKLE_FEED_URL)"
        INFOPLIST_KEY_SUPublicEDKey: "$(HEADROOM_SPARKLE_PUBLIC_ED_KEY)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  HeadroomWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/HeadroomWidgetSharedUI
      # KTD1 (iOS parity): one shared stateless component folder on every host.
      - path: Sources/HeadroomSharedUI
      - path: Sources/HeadroomWidgets
        excludes:
          - HeadroomWidgets.entitlements
          - Info.plist
      - path: Sources/HeadroomSharedResources/BrandIcons.xcassets
    dependencies:
      - target: HeadroomCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.widgets
        MARKETING_VERSION: 1.8
        CURRENT_PROJECT_VERSION: 48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/HeadroomWidgets/Info.plist
        INFOPLIST_KEY_HeadroomAppGroupIdentifier: "$(HEADROOM_APP_GROUP_IDENTIFIER)"
        CODE_SIGN_ENTITLEMENTS: Sources/HeadroomWidgets/HeadroomWidgets.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  HeadroomIOS:
    type: application
    platform: iOS
    sources:
      # Loading-language KTD7: phone placeholders use the same vessel renderer as widgets;
      # U12's read-only gallery previews the real widget styles.
      - path: Sources/HeadroomWidgetSharedUI
      - path: Sources/HeadroomIOS
        excludes:
          - HeadroomIOS.entitlements
          - Info.plist
      - path: Sources/HeadroomApp/Resources/Assets.xcassets
      - path: Sources/HeadroomSharedResources/BrandIcons.xcassets
      # KTD4 (iOS parity): shared Core folders stay dependency-closed; Mac-only
      # logic belongs in Engine/Providers/Credentials or the Mac app.
      - path: Sources/HeadroomCore/Models
      - path: Sources/HeadroomCore/Notifications
      - path: Sources/HeadroomCore/Settings
        excludes:
          - LaunchAtLogin.swift
      - path: Sources/HeadroomCore/Sync
      - path: Sources/HeadroomCore/Widgets
        excludes:
          - WidgetSnapshotProjector.swift
      # KTD1 (iOS parity): one shared stateless component folder on every host.
      - path: Sources/HeadroomSharedUI
    dependencies:
      - target: HeadroomIOSWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.ios
        MARKETING_VERSION: 1.8
        CURRENT_PROJECT_VERSION: 48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/HeadroomIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/HeadroomIOS/HeadroomIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  HeadroomIOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/HeadroomWidgetSharedUI
      # KTD1 (iOS parity): one shared stateless component folder on every host.
      - path: Sources/HeadroomSharedUI
      - path: Sources/HeadroomIOSWidgets
        excludes:
          - HeadroomIOSWidgets.entitlements
          - Info.plist
      # KTD1/KTD2 (widget-styles plan): one Edit Widget intent shared with the macOS extension.
      - path: Sources/HeadroomWidgets/HeadroomWidgetConfigurationIntent.swift
      - path: Sources/HeadroomSharedResources/BrandIcons.xcassets
      # KTD4 (iOS parity): shared Core folders stay dependency-closed; Mac-only
      # logic belongs in Engine/Providers/Credentials or the Mac app.
      - path: Sources/HeadroomCore/Models
      - path: Sources/HeadroomCore/Notifications
      - path: Sources/HeadroomCore/Settings
        excludes:
          - LaunchAtLogin.swift
      - path: Sources/HeadroomCore/Sync
      - path: Sources/HeadroomCore/Widgets
        excludes:
          - WidgetSnapshotProjector.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.ios.widgets
        MARKETING_VERSION: 1.8
        CURRENT_PROJECT_VERSION: 48
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/HeadroomIOSWidgets/Info.plist
        INFOPLIST_KEY_HeadroomAppGroupIdentifier: "$(HEADROOM_APP_GROUP_IDENTIFIER)"
        CODE_SIGN_ENTITLEMENTS: Sources/HeadroomIOSWidgets/HeadroomIOSWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  HeadroomIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HeadroomIOSUITests
    dependencies:
      - target: HeadroomIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  HeadroomAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HeadroomAppTests
    dependencies:
      - target: Headroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylezantos.headroom.app-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Headroom:
    build:
      targets:
        Headroom: all
    run:
      config: Debug
    archive:
      config: Release
  HeadroomAppTests:
    build:
      targets:
        Headroom: all
        HeadroomAppTests: [test]
    test:
      # The hosted unit suite uses isolated fixtures while another real copy may run.
      commandLineArguments:
        "--demo": true
      targets:
        - HeadroomAppTests
